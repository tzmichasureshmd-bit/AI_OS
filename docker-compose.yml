# ============================================
# TZMICHA AI OS - Docker Compose
# One command to run the entire platform:
#   docker compose up -d
# ============================================

services:
  # ===== PostgreSQL - Primary Database =====
  postgres:
    image: postgres:16-alpine
    container_name: tzmicha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tzmicha_db
      POSTGRES_USER: tzmicha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tzmicha_secure_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tzmicha -d tzmicha_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== Redis - Cache, Sessions, Rate Limiting, Queues =====
  redis:
    image: redis:7-alpine
    container_name: tzmicha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ===== Qdrant - Vector Database (RAG, Conversation Memory) =====
  qdrant:
    image: qdrant/qdrant:latest
    container_name: tzmicha-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== TZMICHA Backend - FastAPI Voice AI Engine =====
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tzmicha-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://tzmicha:${POSTGRES_PASSWORD:-tzmicha_secure_2024}@postgres:5432/tzmicha_db
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333

      # Providers (from .env file)
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}

      # API Keys
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-http://localhost:8000}
    volumes:
      - ./platform:/app/platform
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
