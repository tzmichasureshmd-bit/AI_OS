# ===== TZMICHA AI OS - Development Docker Compose =====
# Run: docker compose up -d

services:
  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: tzmicha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tzmicha
      POSTGRES_USER: tzmicha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tzmicha_dev_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tzmicha"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: tzmicha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== Qdrant (Vector DB for RAG) =====
  qdrant:
    image: qdrant/qdrant:latest
    container_name: tzmicha-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===== API Server =====
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: tzmicha-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://tzmicha:${POSTGRES_PASSWORD:-tzmicha_dev_2024}@postgres:5432/tzmicha
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    env_file:
      - .env
    volumes:
      - ./apps/api/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
